; EK Triangle - settings for the triangle symbols in Revit dialogs
; (Visibility/Graphics and other tree lists). Restart Revit after editing.
; The Project Browser is not controlled by this file.
[Glyph]
; 1 = on, 0 = off (the add-in still loads but changes nothing)
Enabled=1

; 1 = write a short startup log to %LOCALAPPDATA%\EKTriangle\Logs\Native.log (size-limited)
Log=1

; Symbol colour (#RRGGBB)
Color=#555555

; Triangle = built-in pixel-aligned triangles (recommended)
Style=Triangle

; 1 = smooth (anti-aliased) diagonal edges, 0 = hard edges
Smoothing=1
