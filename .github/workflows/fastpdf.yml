name: EK FastPDF (Windows build, tests, benchmarks, installer)

on:
  push:
    paths:
      - 'fastpdf/**'
      - '.github/workflows/fastpdf.yml'
  workflow_dispatch:

concurrency:
  group: fastpdf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh
    working-directory: fastpdf

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Inno Setup 6.6.1 (pinned)
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'inno.zip'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.6.1/tools.innosetup.6.6.1.nupkg' -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'inno')
          "ISCC=$(Join-Path $env:RUNNER_TEMP 'inno\tools\ISCC.exe')" >> $env:GITHUB_ENV

      - name: Machine
        run: |
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfCores, NumberOfLogicalProcessors
          Get-CimInstance Win32_VideoController | Format-List Name, AdapterRAM, DriverVersion
          "RAM: {0:N1} GB" -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)

      - name: Tests, publish, smoke test, portable ZIP, installer
        run: ./build/build.ps1 -Iscc $env:ISCC

      - name: Engine benchmark (v1.1 render path vs v1.2 worker pool)
        run: |
          New-Item -ItemType Directory -Force out/bench | Out-Null
          $bench = 'tools/EKFastPDF.Bench/bin/Release/net8.0/EKFastPDF.Bench.exe'
          & $bench engine out/samples --workers 1,2,3,4 --tiles 256,512,1024 --out out/bench/engine.json | Tee-Object out/bench/engine.md
          if ($LASTEXITCODE -ne 0) { throw 'engine benchmark failed' }

      - name: Viewer benchmark (real WPF window, scripted zoom/pan/search/tabs)
        run: |
          $exe = Resolve-Path out/publish/EKFastPDF/EKFastPDF.exe
          $p = Start-Process -FilePath $exe -ArgumentList '--benchmark', "$PWD\out\bench\viewer" -PassThru
          if (-not $p.WaitForExit(30 * 60 * 1000)) { $p.Kill(); throw 'viewer benchmark timed out' }
          Get-Content out/bench/viewer/results.md
          if ($p.ExitCode -ne 0) { throw "viewer benchmark exit code $($p.ExitCode)" }

      - name: Install, launch (Explorer, shortcuts, Open with, App Paths), print, upgrade, uninstall
        run: |
          ./tests/installer/Test-FastPdfInstall.ps1 -Setup out/installer/EK_FastPDF_Setup_v1.2.exe `
            -SamplePdf out/samples/simple-text.pdf -ResultDir out/test-results/install
          Get-Content out/test-results/install/install-tests.md

      - name: Publish the tested installer and portable ZIP as a prerelease
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'fastpdf-v1.2.0'
          @"
          EK FastPDF 1.2.0 - Windows 10/11 x64.

          * EK_FastPDF_Setup_v1.2.exe - installer (Program Files, Start menu, optional desktop shortcut and "Open with" entry, uninstall in Settings > Apps).
          * EK_FastPDF_Portable_v1.2.zip - portable folder; extract to a local disk and run EKFastPDF.exe.

          Built and tested by CI on a Windows Server 2022 VM (2 cores, no GPU): unit/engine tests, scripted viewer benchmark, silent install, launch through Explorer / shortcuts / Open with / App Paths, printing, upgrade and uninstall. Not code-signed: SmartScreen may ask once (More info > Run anyway). Not yet tested on the target i7-12700 / T1000 workstation - see fastpdf/docs/WINDOWS-TEST-CHECKLIST.md.
          Source commit: $env:GITHUB_SHA
          "@ | Set-Content out/RELEASE-NOTES.md -Encoding UTF8
          gh release delete $tag --yes --cleanup-tag 2>$null
          gh release create $tag --target $env:GITHUB_SHA --prerelease --title 'EK FastPDF 1.2.0 (CI build, unsigned)' --notes-file out/RELEASE-NOTES.md `
            out/installer/EK_FastPDF_Setup_v1.2.exe out/installer/EK_FastPDF_Portable_v1.2.zip out/installer/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

      - name: Summary
        if: always()
        run: |
          foreach ($f in 'out/test-results/install/install-tests.md', 'out/bench/viewer/results.md') {
            if (Test-Path $f) { Get-Content $f | Out-File -Append $env:GITHUB_STEP_SUMMARY; '' | Out-File -Append $env:GITHUB_STEP_SUMMARY }
          }
          if (Test-Path out/bench/engine.md) { '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY; Get-Content out/bench/engine.md | Select-Object -Last 120 | Out-File -Append $env:GITHUB_STEP_SUMMARY; '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY }

      - name: Collect results into docs/ci-results (screenshots reduced for the repository)
        if: always()
        run: |
          $dest = 'docs/ci-results'
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force $dest | Out-Null
          foreach ($f in 'out/bench/engine.md', 'out/bench/viewer/results.md', 'out/test-results/install/install-tests.md', 'out/test-results/install/diagnostics-report.txt', 'out/installer/SHA256SUMS.txt') {
            if (Test-Path $f) { Copy-Item $f $dest }
          }
          if (Test-Path "$dest/results.md") { Rename-Item "$dest/results.md" 'viewer-benchmark.md' }
          if (Test-Path "$dest/engine.md") { Rename-Item "$dest/engine.md" 'engine-benchmark.md' }
          "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID (commit $env:GITHUB_SHA), $(Get-Date -Format u)" | Set-Content "$dest/RUN.txt"
          Add-Type -AssemblyName System.Drawing
          $jpeg = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object MimeType -eq 'image/jpeg'
          $q = New-Object System.Drawing.Imaging.EncoderParameters 1
          $q.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter([System.Drawing.Imaging.Encoder]::Quality, [long]85)
          Get-ChildItem out/bench/viewer -Filter *.png -ErrorAction SilentlyContinue | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $w = [Math]::Min(1100, $img.Width); $h = [int]($img.Height * $w / $img.Width)
            $small = New-Object System.Drawing.Bitmap $img, $w, $h
            $small.Save((Join-Path $dest "$($_.BaseName).jpg"), $jpeg, $q)
            # 1:1 crop of the document area to judge sharpness.
            $crop = New-Object System.Drawing.Bitmap 600, 340
            $g = [System.Drawing.Graphics]::FromImage($crop)
            $g.DrawImage($img, (New-Object System.Drawing.Rectangle 0, 0, 600, 340), (New-Object System.Drawing.Rectangle ([int]($img.Width / 2 - 300)), ([int]($img.Height / 2 - 120)), 600, 340), [System.Drawing.GraphicsUnit]::Pixel)
            $crop.Save((Join-Path $dest "$($_.BaseName)-crop100.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $crop.Dispose(); $small.Dispose(); $img.Dispose()
          }

      - name: Commit results to this branch
        if: always() && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ci-results
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "FastPDF CI results for ${env:GITHUB_SHA} [skip ci]"
            for ($i = 0; $i -lt 4; $i++) {
              git pull --rebase origin "${env:GITHUB_REF_NAME}"
              git push origin "HEAD:${env:GITHUB_REF_NAME}"
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds (2 * [Math]::Pow(2, $i))
            }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EK_FastPDF_v1.2_Windows
          path: |
            fastpdf/out/installer/EK_FastPDF_Setup_v1.2.exe
            fastpdf/out/installer/EK_FastPDF_Portable_v1.2.zip
            fastpdf/out/installer/SHA256SUMS.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EK_FastPDF_test_and_benchmark_results
          path: |
            fastpdf/out/bench/engine.md
            fastpdf/out/bench/engine.json
            fastpdf/out/bench/viewer/*.md
            fastpdf/out/bench/viewer/*.json
            fastpdf/out/bench/viewer/*.png
            fastpdf/out/test-results
          if-no-files-found: warn
