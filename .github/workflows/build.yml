name: Build and test (Windows)

on:
  push:
    paths-ignore:
      - 'release/**'
      - '**.md'
      - 'script-launcher/**'
      - 'EK_Script_Launcher/**'
      - 'EK_Script_Launcher.zip'
      - '.github/workflows/script-launcher.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Inno Setup 6.6.1 (pinned)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'inno.zip'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.6.1/tools.innosetup.6.6.1.nupkg' -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'inno')
          "ISCC=$(Join-Path $env:RUNNER_TEMP 'inno\tools\ISCC.exe')" >> $env:GITHUB_ENV

      - name: Build, unit tests, native tests, payload checks, installer
        shell: pwsh
        run: ./build/build.ps1 -Iscc $env:ISCC

      - name: End-to-end installer tests (simulated Revit 2024/2025/2027)
        shell: pwsh
        run: |
          $fx = Join-Path $env:RUNNER_TEMP 'fixtures'
          $env:EKT_FIXTURE_DIR = $fx
          "EKT_FIXTURE_DIR=$fx" >> $env:GITHUB_ENV
          dotnet test tests/EKTriangle.Tests -c Release --no-build -f net8.0 --filter "FullyQualifiedName~FixtureExport" --nologo
          ./tests/installer/Test-Installer.ps1 -Setup out/installer/EK_Triangle_Setup.exe -Fixtures $fx `
            -FakeRevitExe out/native/Revit.exe -ResultDir out/test-results/e2e

      - name: Build and test SIMPLE PowerShell installer (all four simulated Revit versions)
        shell: pwsh
        run: |
          ./build/Build-SimplePackage.ps1
          ./tests/installer/Test-SimplePackage.ps1 -Zip out/simple-package/EK_Triangle_SIMPLE_Installer.zip `
            -Fixtures $env:EKT_FIXTURE_DIR -FakeRevitExe out/native/Revit.exe

      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          $v = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          ./tests/ci/Write-TestSummary.ps1 -ResultDir out/test-results -OutFile out/TEST-RESULTS.md -Version $v
          Get-Content out/TEST-RESULTS.md | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Finalize SIMPLE ZIP with test report and verify extracted archive
        shell: pwsh
        run: |
          ./build/Build-SimplePackage.ps1
          ./tests/installer/Test-SimplePackage.ps1 -Zip out/simple-package/EK_Triangle_SIMPLE_Installer.zip -VerifyOnly

      - uses: actions/upload-artifact@v4
        with:
          name: EK_Triangle_SIMPLE_Installer
          path: |
            out/simple-package/EK_Triangle_SIMPLE_Installer.zip
            out/simple-package/SIMPLE-SHA256SUMS.txt
            out/simple-package/EK_Triangle_SIMPLE_Installer/CODE-INVENTORY.csv
            out/TEST-RESULTS.md
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EK_Triangle_Setup
          path: |
            out/installer/EK_Triangle_Setup.exe
            out/installer/SHA256SUMS.txt
            out/TEST-RESULTS.md
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: out/test-results

      - name: Commit release files to this branch
        if: github.event_name != 'pull_request' && success()
        shell: pwsh
        run: |
          $v = (Get-Content build/SIMPLE-VERSION.txt -Raw).Trim()
          $dest = "release/simple/$v"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item out/TEST-RESULTS.md $dest -Force
          Copy-Item out/test-results/native-glyphs.bmp "$dest/native-glyphs-windows.bmp" -ErrorAction SilentlyContinue
          Copy-Item out/simple-package/EK_Triangle_SIMPLE_Installer.zip $dest -Force
          Copy-Item out/simple-package/SIMPLE-SHA256SUMS.txt $dest -Force
          Copy-Item out/simple-package/EK_Triangle_SIMPLE_Installer/CODE-INVENTORY.csv $dest -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Release build $v from ${env:GITHUB_SHA} [skip ci]"
            git pull --rebase origin "${env:GITHUB_REF_NAME}"
            git push origin "HEAD:${env:GITHUB_REF_NAME}"
          }

      - name: Publish tested SIMPLE installer
        if: github.event_name != 'pull_request' && success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content build/SIMPLE-VERSION.txt -Raw).Trim()
          $tag = "simple-v$v"
          $notes = @"
          EK Triangle SIMPLE installer: extract the complete ZIP and double-click INSTALL.cmd.
          Ordinary readable PowerShell scripts; zero EXEs in the package; no runtime compilation or dependency downloads. All existing Revit 2024-2027 application DLLs are included.
          Reuses the existing compatibility checks, ownership/migration logic and verified backup/restore library directly as a DLL.
          Uses configured PowerShell policy. If a script or DLL is blocked, stop for IT approval. Includes inventory, SHA-256 checksums, launch investigation and Windows simulation report.
          Actual operation inside Revit and company security approval are not established by CI.
          Source: $env:GITHUB_SHA
          "@
          $notes | Set-Content out/RELEASE-NOTES.md -Encoding UTF8
          gh release create $tag --target $env:GITHUB_SHA --title "EK Triangle SIMPLE $v" --prerelease --notes-file out/RELEASE-NOTES.md `
            out/simple-package/EK_Triangle_SIMPLE_Installer.zip `
            out/simple-package/SIMPLE-SHA256SUMS.txt `
            out/simple-package/EK_Triangle_SIMPLE_Installer/CODE-INVENTORY.csv `
            out/TEST-RESULTS.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
