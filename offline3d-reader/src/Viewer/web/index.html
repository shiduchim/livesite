<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'none'; connect-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'"><title>Offline 3D box</title><link rel="stylesheet" href="style.css"><script src="vendor/babylon.js"></script><script src="vendor/loaders.js"></script><script src="vendor/earcut.js"></script><script type="module" src="app.mjs"></script></head><body>
<header><strong>Drawing &amp; 3D box</strong><span id="kind">Local · Offline</span></header>
<main><section id="drawing"><div class="tools"><button id="fit">Fit page</button><label>Zoom <input id="zoom" type="number" min="25" max="300" value="100" step="25"> %</label></div><div id="paperScroll"><div id="paper"><canvas id="pdf"></canvas><div id="marker" hidden></div></div><p id="empty">Open a PDF using the button above.</p></div><textarea id="coordinate" readonly aria-label="Last PDF coordinate" placeholder="Page coordinates appear here for calibration"></textarea></section>
<aside id="panel"><div class="tools"><strong>3D box</strong><button id="reset">Reset</button><button id="hide">Hide</button></div><div class="dimensions"><label>Width <input id="width" type="number" value="304.8" min="1" max="3000"> cm</label><label>Above level <input id="above" type="number" value="304.8" min="1" max="3000"> cm</label><label>Below level <input id="below" type="number" value="15.24" min="0" max="3000"> cm</label></div><canvas id="scene"></canvas><p id="hint">Click inside a registered plan. Drag to orbit, right-drag to pan, scroll to zoom.</p><output id="metrics"></output></aside></main>
</body></html>
