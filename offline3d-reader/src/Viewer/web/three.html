<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self' 'unsafe-eval';style-src 'self' 'unsafe-inline';connect-src 'self' blob:;img-src data: blob:;worker-src 'self' blob:;object-src 'none';base-uri 'none'"><link rel="stylesheet" href="three.css"><script src="vendor/babylon.js"></script><script src="vendor/loaders.js"></script><script src="vendor/earcut.js"></script><script type="module" src="three.mjs"></script></head><body>
<header class="tools"><strong title="Orthographic 3D section · EKPDF 0.5.4">3D view</strong><button id="settings-toggle" aria-expanded="false" aria-controls="settings-panel">Settings</button><button id="tools-toggle" aria-expanded="false" aria-controls="tools-panel">Tools</button><button id="measure" aria-pressed="false" title="Click two points; corners and edges snap. Esc stops.">Measure</button><button id="undock">Undock</button><button id="hide" title="Close 3D view">Close</button></header>
<div class="model-area"><canvas id="scene" tabindex="0"></canvas>
<div id="loading" class="loading" role="status"><div class="spinner" aria-hidden="true"></div><span id="loading-text">Opening 3D view…</span></div>
<svg id="measure-layer" class="measure-layer" aria-hidden="true"></svg>
<section id="settings-panel" class="view-menu" hidden aria-label="3D settings">
<div class="menu-title title-row">Section box<div class="unit-switch" role="group" aria-label="Units"><button id="unit-feet" aria-pressed="true">Feet</button><button id="unit-meters" aria-pressed="false">Meters</button></div></div>
<div class="box-defaults"><div class="box-grid">
<svg class="box-picture" viewBox="0 -4 66 130" width="66" height="130" aria-hidden="true"><path class="top" d="M4,2 L10.16,-2.48 H41.84 L48,2 Z"/><path class="front" d="M4,2 H48 V72 H4 Z"/><path class="faint" d="M10.16,-2.48 H41.84 V47.92 H10.16 Z"/><path class="faint" d="M4,72 L10.16,47.92 M48,72 L41.84,47.92 M4,2 L10.16,-2.48 M48,2 L41.84,-2.48"/><path class="level" d="M4,54 L10.16,34.96 H41.84 L48,54 Z"/><circle class="dot" cx="26" cy="44.48" r="3"/><path class="dim" d="M59.5,3 V53 M56.5,7 l3,-4 l3,4 M56.5,49 l3,4 l3,-4 M54,2.5 h10 M54,54.5 h10"/><path class="dim" d="M59.5,55 V71 M56.5,59 l3,-4 l3,4 M56.5,67 l3,4 l3,-4 M54,72.5 h10"/><path class="dim" d="M5,106.5 H47 M9,103.5 l-4,3 l4,3 M43,103.5 l4,3 l-4,3"/><path class="dim faint-dim" d="M4.5,74 V110 M48.5,74 V110"/></svg>
<label class="box-row" for="box-above">Height above level</label><span class="number"><input id="box-above" data-key="above" inputmode="decimal" autocomplete="off" value="10.00"><span class="steps"><button tabindex="-1" data-step="1" aria-label="Increase">▲</button><button tabindex="-1" data-step="-1" aria-label="Decrease">▼</button></span></span><span class="box-unit">ft</span>
<label class="box-row" for="box-below">Height below level</label><span class="number"><input id="box-below" data-key="below" inputmode="decimal" autocomplete="off" value="0.50"><span class="steps"><button tabindex="-1" data-step="1" aria-label="Increase">▲</button><button tabindex="-1" data-step="-1" aria-label="Decrease">▼</button></span></span><span class="box-unit">ft</span>
<label class="box-row" for="box-square">Square size</label><span class="number"><input id="box-square" data-key="square" inputmode="decimal" autocomplete="off" value="10.00"><span class="steps"><button tabindex="-1" data-step="1" aria-label="Increase">▲</button><button tabindex="-1" data-step="-1" aria-label="Decrease">▼</button></span></span><span class="box-unit">ft</span>
</div><div class="box-footer"><output id="defaults-status" aria-live="polite"></output><button id="restore-box-default" class="link" title="Back to 10.00 ft square, 10.00 ft above and 0.50 ft below">Reset</button></div></div>
<div class="menu-title">View</div>
<div class="settings"><label>Renderer <select id="engine"><option value="babylon">Babylon.js</option><option value="three">Three.js</option></select></label><label>Quality <select id="quality"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="ultra">Extra High</option></select></label><label>Display <select id="style"><option value="wireframe">Wireframe</option><option value="hidden">Hidden line</option><option value="shaded" selected>Shaded</option><option value="colors">Consistent colors</option><option value="realistic">Realistic</option></select></label>
<label>Brightness <span class="range"><input id="brightness" type="range" min="0.5" max="1.6" step="0.02" value="1"><button id="brightness-reset" title="Reset brightness">Reset</button></span></label>
<label class="check"><input id="edges" type="checkbox" checked> Edges</label><label class="check"><input id="occlusion" type="checkbox" checked> Contact shading</label><label class="check"><input id="caps" type="checkbox" checked> Solid cuts</label><label class="check"><input id="shadows" type="checkbox"> Shadows (Realistic)</label><label class="check"><input id="navigator" type="checkbox" checked> Orientation cube and Home</label></div>
<details><summary>Performance</summary><output id="metrics"></output></details></section>
<section id="tools-panel" class="view-menu" hidden aria-label="3D tools"><div class="model-actions"><button id="box-reset" title="Put the box back to its remembered size at the clicked point">Reset box</button><button id="focus-selection">Focus selected</button><button id="clear-selection">Clear selection</button><button id="hide-selection">Hide selected</button><button id="isolate-selection">Isolate</button><button id="xray-selection">X-ray others</button><button id="show-all">Show all</button></div></section>
<button id="reset" class="home-view" title="Return to the home orientation and fit the box (Home key)">⌂ Home</button><div class="view-cube" tabindex="0" role="group" aria-label="Orientation cube" title="Click a face or drag to rotate. Arrow keys rotate; Page Up is Top; Page Down is Bottom."><div class="cube-body"><button class="cube-face cube-front" data-view="front" title="Front view">FRONT</button><button class="cube-face cube-back" data-view="back" title="Back view">BACK</button><button class="cube-face cube-left" data-view="left" title="Left view">LEFT</button><button class="cube-face cube-right" data-view="right" title="Right view">RIGHT</button><button class="cube-face cube-top" data-view="top" title="Top view">TOP</button><button class="cube-face cube-bottom" data-view="bottom" title="Bottom view">BOTTOM</button></div></div>
<aside id="properties" hidden><div class="property-heading"><strong>Element properties</strong><button id="close-properties" title="Close properties">Close</button></div><div id="property-values"></div></aside><p id="hint"></p></div></body></html>
