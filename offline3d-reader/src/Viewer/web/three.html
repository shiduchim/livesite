<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self' 'unsafe-eval';style-src 'self' 'unsafe-inline';connect-src 'self' blob:;img-src data: blob:;worker-src 'self' blob:;object-src 'none';base-uri 'none'"><link rel="stylesheet" href="three.css"><script src="vendor/babylon.js"></script><script src="vendor/loaders.js"></script><script src="vendor/earcut.js"></script><script type="module" src="three.mjs"></script></head><body>
<header class="tools"><strong title="Orthographic 3D section · v0.5.3">3D view</strong><button id="settings-toggle" aria-expanded="false" aria-controls="settings-panel">Settings</button><button id="tools-toggle" aria-expanded="false" aria-controls="tools-panel">Tools</button><button id="undock">Undock</button><button id="hide" aria-label="Close 3D view" title="Close 3D view">×</button></header>
<div class="model-area"><canvas id="scene" tabindex="0"></canvas>
<div id="loading" class="loading" role="status"><div class="spinner" aria-hidden="true"></div><span id="loading-text">Opening 3D view…</span></div>
<svg id="measure-layer" class="measure-layer" aria-hidden="true"></svg>
<section id="settings-panel" class="view-menu" hidden aria-label="3D settings">
<div class="menu-title title-row">Section box<div class="unit-switch" role="group" aria-label="Units"><button id="unit-feet" aria-pressed="true">ft</button><button id="unit-meters" aria-pressed="false">m</button></div></div>
<div class="box-defaults"><output id="box-size" class="box-size">10'-0" × 10'-0" · 10'-0" above · 0'-6" below</output><p class="note">New boxes use the size you last stretched a box to.</p><button id="restore-box-default">Restore default size</button><output id="defaults-status" aria-live="polite"></output></div>
<div class="menu-title">View</div>
<div class="settings"><label>Renderer <select id="engine"><option value="babylon">Babylon.js</option><option value="three">Three.js</option></select></label><label>Quality <select id="quality"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="ultra">Extra High</option></select></label><label>Display <select id="style"><option value="wireframe">Wireframe</option><option value="hidden">Hidden line</option><option value="shaded" selected>Shaded</option><option value="colors">Consistent colors</option><option value="realistic">Realistic</option></select></label>
<label>Brightness <span class="range"><input id="brightness" type="range" min="0.5" max="1.6" step="0.02" value="1"><button id="brightness-reset" title="Reset brightness">Reset</button></span></label>
<label class="check"><input id="edges" type="checkbox" checked> Edges</label><label class="check"><input id="occlusion" type="checkbox" checked> Contact shading</label><label class="check"><input id="caps" type="checkbox" checked> Solid cuts</label><label class="check"><input id="shadows" type="checkbox"> Shadows (Realistic)</label><label class="check"><input id="navigator" type="checkbox" checked> Orientation cube and Home</label></div>
<details><summary>Performance</summary><output id="metrics"></output></details></section>
<section id="tools-panel" class="view-menu" hidden aria-label="3D tools"><div class="model-actions"><button id="measure">Measure</button><button id="box-reset" title="Put the box back to its remembered size at the clicked point">Reset box</button><button id="focus-selection">Focus selected</button><button id="clear-selection">Clear selection</button><button id="hide-selection">Hide selected</button><button id="isolate-selection">Isolate</button><button id="xray-selection">X-ray others</button><button id="show-all">Show all</button></div></section>
<button id="reset" class="home-view" title="Return to the home orientation and fit the box (Home key)">⌂ Home</button><div class="view-cube" tabindex="0" role="group" aria-label="Orientation cube" title="Click a face or drag to rotate. Arrow keys rotate; Page Up is Top; Page Down is Bottom."><div class="cube-body"><button class="cube-face cube-front" data-view="front" title="Front view">FRONT</button><button class="cube-face cube-back" data-view="back" title="Back view">BACK</button><button class="cube-face cube-left" data-view="left" title="Left view">LEFT</button><button class="cube-face cube-right" data-view="right" title="Right view">RIGHT</button><button class="cube-face cube-top" data-view="top" title="Top view">TOP</button><button class="cube-face cube-bottom" data-view="bottom" title="Bottom view">BOTTOM</button></div></div>
<aside id="properties" hidden><div class="property-heading"><strong>Element properties</strong><button id="close-properties" aria-label="Close properties" title="Close properties">×</button></div><div id="property-values"></div></aside><p id="hint"></p></div></body></html>
