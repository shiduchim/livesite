<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self' 'unsafe-eval';style-src 'self' 'unsafe-inline';connect-src 'self' blob:;img-src data: blob:;worker-src 'self' blob:;object-src 'none';base-uri 'none'"><link rel="stylesheet" href="three.css"><script src="vendor/babylon.js"></script><script src="vendor/loaders.js"></script><script src="vendor/earcut.js"></script><script type="module" src="three.mjs"></script></head><body>
<header class="tools"><strong title="Orthographic 3D section · v0.5.3">3D · v0.5.3</strong><button id="settings-toggle" aria-expanded="false" aria-controls="settings-panel">Settings</button><button id="tools-toggle" aria-expanded="false" aria-controls="tools-panel">Tools</button><button id="undock">Undock</button><button id="hide" aria-label="Hide 3D view" title="Hide 3D view">×</button></header>
<div class="model-area"><canvas id="scene" tabindex="0"></canvas>
<section id="settings-panel" class="view-menu" hidden aria-label="3D settings"><div class="menu-title">Default section box</div><div class="box-defaults"><div class="unit-switch" role="group" aria-label="Box units"><button id="unit-feet" aria-pressed="true">Feet</button><button id="unit-meters" aria-pressed="false">Meters</button></div><label>Height above level <span><input id="default-above" type="number" min="0.04" step="any" value="10.00"><span class="box-unit">ft</span></span></label><label>Height below level <span><input id="default-below" type="number" min="0" step="any" value="0.50"><span class="box-unit">ft</span></span></label><label>Square size <span><input id="default-square" type="number" min="0.04" step="any" value="10.00"><span class="box-unit">ft</span></span></label><button id="save-box-defaults">Save defaults &amp; apply</button><output id="defaults-status" aria-live="polite">Used when opening 3D and by Reset box.</output></div><div class="menu-title">View settings</div><div class="settings"><label>Renderer <select id="engine"><option value="babylon">Babylon.js</option><option value="three">Three.js</option></select></label><label>Quality <select id="quality"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="ultra">Extra High</option></select></label><label>Display <select id="style"><option value="wireframe">Wireframe</option><option value="hidden">Hidden line</option><option value="shaded" selected>Shaded</option><option value="colors">Consistent colors</option><option value="realistic">Realistic</option></select></label></div><details><summary>Lighting and sections</summary><div class="settings"><label><input id="edges" type="checkbox" checked> Edges</label><label><input id="shadows" type="checkbox"> Shadows</label><label><input id="occlusion" type="checkbox" checked> Contact shading</label><label><input id="caps" type="checkbox" checked> Solid cuts</label><label>Exposure <input id="exposure" type="range" min="0.3" max="2.5" step="0.05" value="1"></label><label>Environment <input id="environment" type="range" min="0" max="2" step="0.05" value="1"></label></div></details><details><summary>Performance</summary><output id="metrics"></output></details></section>
<section id="tools-panel" class="view-menu" hidden aria-label="3D tools"><div class="menu-title">Model tools</div><div class="model-actions"><button id="box-reset" title="Restore your saved default size at your clicked point">Reset box size</button><button id="focus-selection">Focus selected</button><button id="clear-selection">Clear selection</button><button id="hide-selection">Hide selected</button><button id="isolate-selection">Isolate</button><button id="xray-selection">X-ray others</button><button id="show-all">Show all</button><button id="measure">Measure</button></div></section>
<button id="reset" class="home-view" title="Return to the home orientation and fit the section">⌂ Home view</button><div class="view-cube" tabindex="0" role="group" aria-label="Orientation cube" title="Click a face or drag to rotate. Arrow keys rotate; Page Up is Top; Page Down is Bottom."><div class="cube-body"><button class="cube-face cube-front" data-view="front" title="Front view">FRONT</button><button class="cube-face cube-back" data-view="back" title="Back view">BACK</button><button class="cube-face cube-left" data-view="left" title="Left view">LEFT</button><button class="cube-face cube-right" data-view="right" title="Right view">RIGHT</button><button class="cube-face cube-top" data-view="top" title="Top view">TOP</button><button class="cube-face cube-bottom" data-view="bottom" title="Bottom view">BOTTOM</button></div></div>
<aside id="properties" hidden><div class="property-heading"><strong>Element properties</strong><button id="close-properties" aria-label="Close properties" title="Close properties">×</button></div><div id="property-values"></div></aside><p id="hint">Click inside the PDF plan to position the section.</p></div></body></html>
