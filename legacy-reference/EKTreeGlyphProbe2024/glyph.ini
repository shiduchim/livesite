; EK Expander Glyph settings. Edit, then restart Revit.
[Glyph]
; 0 = add-in loads but changes nothing (instant kill switch without uninstalling)
Enabled=1

; 1 = write %LOCALAPPDATA%\EKGlyph\EKGlyph.log: one line per distinct caller
; module/offset that draws a TREEVIEW glyph. Use it for the verification test.
Log=1

; Your design as SVG path data, in the coordinate space given by ViewBox.
; It is scaled to fit the glyph rectangle Revit asks for (9 px at 100% DPI,
; larger at higher DPI) and centred. Closed = collapsed node (was "+"),
; Opened = expanded node (was "-").
; PLACEHOLDER: a "T" and its bar. Paste your Project Browser path here.
ViewBox=0 0 16 16
Closed=M3 3H13V5.5H9.25V13H6.75V5.5H3Z
Opened=M3 3H13V5.5H3Z

; #RRGGBB, #AARRGGBB, or WindowText (follows the Windows text colour)
Color=#2B579A
; 1 = anti-aliased edges, 0 = crisp pixel edges
Smoothing=1

; Optional: use PNG images (with transparency) instead of the paths above.
; Relative paths are resolved against this folder.
ClosedPng=
OpenedPng=

; uxtheme TREEVIEW parts to replace: 2 = TVP_GLYPH, 4 = TVP_HOTGLYPH (hover)
Parts=2,4
