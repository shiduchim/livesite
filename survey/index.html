       else{
        selected=selected.filter(v=>v!=='none');
        if(q.max && selected.length>=q.max){
         input.checked=false;showMessage(d.error);return;
        }
        selected.push(id);
       }
      }else selected=selected.filter(v=>v!==id);
      answers[q.id]=selected;
      options.querySelectorAll('input').forEach(x=>{x.checked=selected.includes(x.value)});
     }
     refreshOther();hideMessage();
    });
    wrapper.append(input,document.createTextNode(label));options.append(wrapper);
   }
   fs.append(options);
   if(q.options.some(opt=>opt[0]==='other')){
    const otherKey=q.id+'_other',box=el('div'),label=el('label'),input=el('textarea');
    box.className='other-detail';
    input.id=otherKey;input.name=otherKey;input.maxLength=250;input.rows=2;input.dir='auto';
    input.placeholder=d.otherPlaceholder;input.value=answers[otherKey]||'';
    label.htmlFor=otherKey;label.textContent=d.specify;
    input.addEventListener('input',()=>{answers[otherKey]=input.value});
    box.append(label,input);fs.append(box);
    refreshOther=()=>{
     const selected=q.type==='checks'?(answers[q.id]||[]).includes('other'):answers[q.id]==='other';
     box.hidden=!selected;
     if(!selected){delete answers[otherKey];input.value=''}
    };
    refreshOther();
   }
  }
  root.append(fs);
 }
 const footer=el('footer'),safe=el('p');safe.className='safety';
 safe.textContent=d.safety;
 const button=el('button');button.className='submit';button.type='submit';button.disabled=isSending;button.textContent=isSending?d.sending:d.submit;
 footer.append(safe,button);root.append(footer);
 const msg=el('div');msg.className='msg';msg.id='message';msg.setAttribute('role','status');root.append(msg);

 const d=dict[language];
 root.innerHTML='';

 const copy=el('button');copy.type='button';copy.className='share-button';copy.textContent=d.copyLink;
 const status=el('p');status.className='share-status';status.setAttribute('role','status');status.setAttribute('aria-live','polite');
 copy.addEventListener('click',async()=>{

  status.textContent=ok?d.copied:d.copyFailed;

function hasAnswers(){
 return Object.entries(answers).some(([key,val])=>
  key.endsWith('_other') ? !!String(val||'').trim() :
  Array.isArray(val) ? val.length>0 : !!String(val||'').trim());
}
// Apps Script's doPost answers {ok:true} only after the row is written and
// flushed, so reading that answer is the confirmation (one round trip, no
// polling). A text/plain POST needs no CORS preflight, and credentials:'omit'
// keeps Google account cookies (multi-account sign-in) out of every request.
// If the answer can't be read, confirm the ID via the read-only status lookup.
// No confirmation = no success screen.
let attemptNumber = 0;
async function readBackend(url, options, timeoutMs) {
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),timeoutMs);
 try{
  const res=await fetch(url,{...options,credentials:'omit',signal:controller.signal});
  return res.ok?await res.text():null;
 }catch(err){return null}
 finally{clearTimeout(timer)}
}
async function postAnswers(payload) {
 const text=await readBackend(BACKEND_URL,{method:'POST',
  headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)},15000);
 try{return !!text&&JSON.parse(text).ok===true}catch(err){return false}
}
// Same lookup as JSONP, read without cookies; null = unreadable, so try JSONP.
async function savedStatusFetch(id, timeoutMs) {
 const callback='zugpadStatus_'+Date.now()+'_'+(++attemptNumber);
 const query=new URLSearchParams({zugpad_status:id,zugpad_callback:callback});
 const text=await readBackend(BACKEND_URL+'?'+query.toString(),{},timeoutMs);
 const match=/\(\{"saved":(true|false)\}\);?\s*$/.exec(text||'');
 return match?match[1]==='true':null;
}
function savedStatusOnce(id, timeoutMs = 5500) {
 return new Promise(resolve => {
  const callback='zugpadStatus_'+Date.now()+'_'+(++attemptNumber);
  const script=el('script');let done=false;
  let timer;
  function finish(result) {
   if(done)return;
   done=true;clearTimeout(timer);
   delete window[callback];script.remove();resolve(result);
  }
  window[callback]=result=>finish(!!(result&&result.saved));
  script.onerror=()=>finish(false);
  timer=setTimeout(()=>finish(false),timeoutMs);
  const query=new URLSearchParams({zugpad_status:id,zugpad_callback:callback});
  script.src=BACKEND_URL+'?'+query.toString();
  document.head.appendChild(script);
 });
}
async function confirmSaved(id) {
 const until=Date.now()+8000;
 while(Date.now()<until) {
  let saved=await savedStatusFetch(id,Math.min(5500,until-Date.now()));
  if(saved===null&&Date.now()<until)saved=await savedStatusOnce(id,Math.min(5500,until-Date.now()));
  if(saved)return true;
  if(navigator.onLine===false||Date.now()+1300>=until)break;
  await new Promise(resolve=>setTimeout(resolve,1300));
 }
 return false;
}
root.addEventListener('submit',async function(e){
 e.preventDefault();
 if(isSending || isSubmitted)return;
 const d=dict[language];
 if(!hasAnswers()){showMessage(d.empty);return;}
 if(!isHosted){showMessage(d.demo);return;}
 isSending=true;hideMessage();
 const btn=root.querySelector('.submit');
 if(btn){btn.disabled=true;btn.textContent=d.sending;}
 const payload={surveyVersion:'v2',submissionId:submissionId,language:language,
  answers:JSON.parse(JSON.stringify(answers))};
 // Offline phones fail at once; retries reuse submissionId (server dedupes).
 const verified=navigator.onLine!==false&&
  (await postAnswers(payload)||await confirmSaved(submissionId));
 isSending=false;
 if(verified){isSubmitted=true;render();}
 else {render();showMessage(dict[language].sendError);}
});
